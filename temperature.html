<form style >
    <div class="field">
        <label>Enter the temperature to convert</label>
        <input type="number" id = "Amount">
    </div>
    <div class="field">
        <label>Unit to convert from</label>

        <select class="field" id="FromUnit">
            <option value="Celsius">Celsius</option>
            <option value="Kelvin">Kelvin</option>
            <option value="Fahrenheit">Fahrenheit</option>
        </select>
    </div>

    <div class="field">
        <label>Unit to convert to</label>
        <select class="field" id = "ToUnit">
            <option value="Celsius">Celsius</option>
            <option value="Kelvin">Kelvin</option>
            <option value="Fahrenheit">Fahrenheit</option>
        </select>
    </div>

    <input class = "ConvertButton" type="button" value="Convert" onclick="convertTemperature(document.getElementById(`Amount`).value, document.getElementById(`FromUnit`).value, document.getElementById(`ToUnit`).value)">
    >
</form>
