
<form style >
  <script src = length.js></script>
  <div class="field" >
    <label>Enter the length to convert</label>
    <input type="number" id = "Amount">
  </div>
  <div class="field">
    <label>Unit to convert from</label>

    <select class="field" id="FromUnit">
      <option value="Meters">Meters</option>
      <option value="Kilometers">Kilometers</option>
      <option value="Miles">Miles</option>
      <option value="Feet">Feet</option>
    </select>
  </div>

  <div class="field">
    <label>Unit to convert to</label>
    <select class="field" id="ToUnit">
      <option value="Meters">Meters</option>
      <option value="Kilometers">Kilometers</option>
      <option value="Miles">Miles</option>
      <option value="Feet">Feet</option>
    </select>
  </div>

  <input class = "ConvertButton" type="button" value="Convert" onclick="convertLength(document.getElementById('Amount').value, document.getElementById('FromUnit').value, document.getElementById('ToUnit').value)">



</form>
